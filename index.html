<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제2종 전기차량 참고구술 암기장 (랜덤 & 60초 타이머)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #f5f7fa;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 12px;
        }

        .container {
            background: #ffffff;
            width: 100%;
            max-width: 600px;
            padding: 16px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .title {
            font-size: 1.05rem;
            font-weight: 700;
            color: #1e293b;
        }

        .info-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .timer-badge {
            font-size: 0.9rem;
            font-weight: 700;
            color: #d97706;
            background: #fef3c7;
            padding: 4px 10px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

            .timer-badge.danger {
                color: #dc2626;
                background: #fee2e2;
                animation: pulse 1s infinite;
            }

        .progress {
            font-size: 0.9rem;
            color: #2563eb;
            font-weight: 700;
            background: #eff6ff;
            padding: 4px 10px;
            border-radius: 20px;
        }

        .timer-bar-container {
            width: 100%;
            height: 6px;
            background-color: #e2e8f0;
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 12px;
        }

        .timer-bar {
            height: 100%;
            width: 100%;
            background-color: #3b82f6;
            transition: width 1s linear, background-color 0.3s ease;
        }

        .card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 12px;
            min-height: auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .btn-timer-reset {
            background-color: #e2e8f0;
            color: #475569;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            flex: none;
        }

            .btn-timer-reset:hover {
                background-color: #cbd5e1;
                color: #1e293b;
            }

        .question {
            font-size: 1.1rem;
            font-weight: 600;
            line-height: 1.6;
            color: #0f172a;
            margin-bottom: 8px;
            white-space: pre-wrap;
        }

        .sign-image {
            max-width: 100%;
            max-height: 80px;
            object-fit: contain;
            display: block;
            margin: 4px auto 8px auto;
            border-radius: 6px;
            border: 1px solid #cbd5e1;
            background-color: #fff;
            padding: 3px;
        }

        .answer {
            font-size: 0.9rem;
            line-height: 1.4;
            color: #1e293b;
            background: #eff6ff;
            padding: 8px 10px;
            border-radius: 6px;
            border-left: 3px solid #2563eb;
            display: none;
            margin-top: 6px;
            white-space: pre-wrap;
        }

        .answer-title {
            font-weight: 700;
            color: #2563eb;
            margin-bottom: 2px;
            font-size: 0.85rem;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-toggle {
            background-color: #3b82f6;
            color: white;
        }

            .btn-toggle:hover {
                background-color: #2563eb;
            }

        .btn-nav {
            background-color: #e2e8f0;
            color: #475569;
        }

            .btn-nav:hover {
                background-color: #cbd5e1;
            }

        .btn-shuffle {
            background-color: #f59e0b;
            color: white;
            padding: 6px 12px;
            font-size: 0.85rem;
            border-radius: 6px;
            margin-bottom: 15px;
            width: auto;
            align-self: flex-end;
        }

            .btn-shuffle:hover {
                background-color: #d97706;
            }

        @keyframes pulse {
            0% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }

            100% {
                opacity: 1;
            }
        }
        /* 제목 옆 종료 버튼 스타일 */
        .title-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-exit {
            background-color: #fee2e2;
            color: #ef4444;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 6px;
            border: 1px solid #fca5a5;
            cursor: pointer;
            transition: all 0.2s ease;
            flex: none;
        }

            .btn-exit:hover {
                background-color: #fca5a5;
                color: #991b1b;
            }

        /* 결과 화면 디자인 스타일 */
        .result-card {
            display: none;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }

        .result-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 12px;
        }

        .result-summary {
            font-size: 0.95rem;
            color: #475569;
            margin-bottom: 16px;
        }

        .solved-list-container {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 12px;
            max-height: 160px;
            overflow-y: auto;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .num-tag {
            background: #eff6ff;
            color: #2563eb;
            border: 1px solid #bfdbfe;
            font-weight: 600;
            font-size: 0.85rem;
            padding: 4px 8px;
            border-radius: 6px;
        }

        .btn-start {
            background-color: #10b981;
            color: white;
            padding: 12px;
            font-size: 1.05rem;
            width: 100%;
        }

            .btn-start:hover {
                background-color: #059669;
            }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <!-- 1. 왼쪽 영역: 제목 + 종료 버튼 -->
            <div class="info-group">
                <!-- 전체 시험 타이머 UI -->
                <div class="timer-badge" style="background: #e0f2fe; color: #0284c7;" id="totalTimerBadge">
                    ⏱️ 전체 <span id="totalTimerText">00:00</span>
                </div>
                <button type="button" class="btn-timer-reset" id="btnPause" onclick="toggleTotalTimer()">⏸️ 일시정지</button>

                <!-- 기존 60초 타이머 & 리셋 -->
                <button type="button" class="btn-timer-reset" onclick="startTimer()">⏱️ 리셋</button>
                <div class="timer-badge" id="timerBadge">⏱️ <span id="timerText">60초</span></div>
                <div class="progress" id="progress">1 / 44</div>

                <!-- 🔥 다시 추가된 구술 종료 버튼 -->
                <button type="button" class="btn-timer-reset" style="background: #fee2e2; color: #dc2626; border-color: #fca5a5;" onclick="finishQuiz()">⏹️ 구술 종료</button>
            </div>
        </div>

        <!-- 타이머 시각적 진행바 -->
        <div class="timer-bar-container">
            <div class="timer-bar" id="timerBar"></div>
        </div>

        <div id="quizArea">
            <div class="card">
                <div class="question" id="question">문제를 불러오는 중입니다...</div>
                <img id="signImg" class="sign-image" src="" alt="표지 이미지" style="display: none;">

                <div class="answer" id="answer">
                    <div id="answerContent"></div>
                </div>
            </div>

            <div class="btn-group">
                <button class="btn-nav" onclick="prevQuestion()">이전</button>
                <button class="btn-toggle" onclick="toggleAnswer()">정답 확인</button>
                <button class="btn-nav" onclick="nextQuestion()">다음</button>
            </div>
        </div>
        <div id="resultCard" class="result-card">
            <div class="result-title">🎉 퀴즈가 종료되었습니다!</div>
            <!-- 🔥 신규: 총 걸린 시간 표시 텍스트 추가 -->
            <div class="result-summary" id="totalTimeResult" style="font-weight: 700; color: #0284c7; margin-bottom: 6px;">
                ⏱️ 총 소요 시간: 0분 0초
            </div>
            <div class="result-summary" id="resultSummary">총 0문제를 학습하셨습니다.</div>

            <div style="font-weight: 700; font-size: 0.85rem; color: #64748b; margin-bottom: 8px; text-align: left;">
                📋 풀었던 문제 번호 (번호순)
            </div>
            <div class="solved-list-container" id="solvedList"></div>

            <button class="btn-start" onclick="initQuiz()">🔄 퀴즈 다시 시작하기</button>
        </div>
    </div>

    <script>
            // 원본 문제 배열
            const rawQuestions = [
                // [1 ~ 38번] 일반 텍스트 문제
                {
                    id: 1,
                    q: "1. EOD주요기능(169번)",
                    a: "1. 응하중 신호 생성\n2. 제동패턴 생성\n3. 전기제동 피드백 수신\n4. 저크 제어\n5. 전기제동 전류 감지\n6. 일괄교차 제어\n7. 히스테리시스 보정\n8. 인쇼트 기능\n9. 모니터 정보 전송"
                },
                {
                    id: 2,
                    q: "2. 밀착연결기",
                    a: "• 밀착연결기에는 MR, BP, SAP 2개 총 4개의 공기관이 연결되고 이물질 끼임 방지를 위한 고무마개로 막혀있으며 구원 운전 시 공기관 연결과 고장 및 구원열차 연결 기능을 하고 있음"
                },
                {
                    id: 3,
                    q: "3. 교직절환시 교류모진 발생 원인 및 조치",
                    a: "• 원인 : MCB 차단불능, MCB 진공파괴, ADS 미절환 (구술 35 교류모진 시 현상 및 조치)"
                },
                {
                    id: 4,
                    q: "4. 직류전환 MCB 양소등 원인",
                    a: "• 일부 M'차 MCB 기계적 고착(용착)\n• 일부 M'차 MCBN1 차단"
                },
                {
                    id: 5,
                    q: "5. 구원연결시 연결해야 하는 기기",
                    a: "• 구원운전스위치, 12점퍼, 103점퍼, 밀착연결기 공기마개, 공기관 Cock"
                },
                {
                    id: 6,
                    q: "6. 접지선 설치 이유",
                    a: "1. 감전방지\n2. 고장전류 귀로 확보\n3. 보호장치 동작 유도\n4. 전기설비 보호\n5. 정전기 및 유도전압 방전\n접지선은 누전 및 지락 발생 시 고장전류의 안전한 통로를 확보하여 감전 사고를 방지하고 보호장치가 신속하게 동작하게 하려고 설치"
                },
                {
                    id: 7,
                    q: "7. 열차방호장치 동작시 수신차량",
                    a: "• 적색상황 발생 등 점멸, 경보음 발생, 수시즉시 비상제동체결, LED 화변 상활발생 수신 메시지 현시\n【수신시 조치】\n비상제동 체결되었으면 완해하고, 조치스위치 취급, 황색 조치등은 점등, 상황 발생등은 계속 점멸, 경보음은 계속 울림\n【발생차량 현상】\n적색상황 발생등 점멸, 10초간 경보음 발생, LCD화면 상황발생 수신 메시지 현시"
                },
                {
                    id: 8,
                    q: "8. ACM 구동불능시 현상조치",
                    a: "전체 ACM 구동 불능 시에는 운전실에서 ACMCS 튀급할 때 ACM 표시등이 점등되지 않으먀, 운전실 HCRN 차단 여부를 확인"
                },
                {
                    id: 9,
                    q: "9. 출입문등 소등 원인",
                    a: "• 출입문이 1개 이상 열렸을 때\n• 출입문스취치(DS) 접점 불량\n• 전후 운전실 DILPN Trip시\n• DOOR등 전구 소손 및 출입문 공기관 콕크 차단시"
                },
                {
                    id: 10,
                    q: "10. 축전지 전압이 낮을 때 Pan 상승 방법",
                    a: "1. 전차선 급전 확인\n2. 축전지 전압 74V 이상 확인\n3. ACM 공기 충기여부 확인 및 ACM 램프 소등 확인\n4. 전부 TC차 MCN, HCRN 차단 여부 확인\n5. 전·후부운전실 EPanDS, ,EGCS작동 여부 확인\n6. 후부운전실에서 취급 확인\n구술 73번 축전지 전압이 낮을 경우 ACM 구동 방법"
                },
                {
                    id: 11,
                    q: "11. ADS 절환해도 MCB 차단 불능 원인",
                    a: "교류구간 MCBN1 차단, 직류구간 MCBN2 차단 MCB 기계적 고착(용착) 시 해당차 MCB 차단불능"
                },
                {
                    id: 12,
                    q: "12. 직류 및 교류구간 전력공급 순서",
                    a: "교류구간 : 전차선 Pan MCB ADCg MT 컨버터 L3 SIV\n직류구간 : 전차선 Pan MCB ADCg L1 SIV"
                },
                {
                    id: 13,
                    q: "13. MCB 투입순서",
                    a: "1. 전부 운전실 MCBCS 취급 MCBHR 여자\n2. ADS위치에 따라 ADCg 절환하여 ADAR, ADDR 여자\n3. MCBR1 여자\n4. MCB-C 코일 여자로 MCB 투입\n5. MCBR2 여자\n6. MCB-C 코일 무여자"
                },
                {
                    id: 14,
                    q: "14. PEC 공전전환기 역할    ",
                    a: "제동통 압력을 전기신호로 변환하여 모니터 장치에 전송하고, 제동 불완해 및 제동력 부족을 검출하여 강제완해 또는 비상제동 조치에 관여하는 장치\n1. 중계변 공기압력을 전기신호로 변환\n2. 제동불완해, 제동력 부족신호 감지\n3. 모니터 제어기기에 신호 전송\n4. 강제완해 전자변(CRV) 제어"
                },
                {
                    id: 15,
                    q: "15. 제동불완해 감지 지령선 가압조건",
                    a: "제동통에 압축공기 압력이 0.8㎏/㎠ 이상 남아 있는 시간이 5초 이상 지속되면 제동불완해가 발생한 것으로 간주하고 모니터 장치에 제동불완해 신호를 보냄"
                },
                {
                    id: 16,
                    q: "16. 객실 비상통화장치 동작시현상",
                    a: "1. 운전실 모니터 고장화면으로 전환\n2. 운전실에 '객실비상' 방송 및 부저 울림\n3. 동작차량 차측등(황색) 점등"
                },
                {
                    id: 17,
                    q: "17. 한국철도공사 구간 25키로 이하 운전 경우",
                    a: "1. 열차 퇴행운전(승인 경우)\n2. 장내출발 진행 수진호 운전\n3. 선로전환기 대항 운전\n4. 추진운전\n5. 차량입환시 "
                },
                {
                    id: 18,
                    q: "18. ACM 공기 공급처",
                    a: "Pan상승, MCB투입, ADCg절환, EGS 동작, L1, L2, L3 투입"
                },
                {
                    id: 20,
                    q: "20. 공전전환기(PEC)의 작용",
                    a: "제동통 압력을 전기신호로 변환하여 모니터 장치에 전송하고, 제동 불완해 및 제동력 부족을 검출하여 강제완해 또는 비상제동 조치에 관여하는 장치\n- 압력 검출 : 제동통 압력 변화를 아날로그 전류신호로 변환하여 모니터 장치에 전송\n- 고장 검출 : 제동 불완해 및 제동력 부족을 검출하고 오류정보를 디지털 신호로 전송\n- 제동 불완해 : 기관사가 강제완해스위치를 취급하면 해당 차량의 제동을 강제완해\n- 제동력 부족 : 부족한 제동력을 보완하기 위해 해당 차량에 비상제동 체결"
                },
                {
                    id: 21,
                    q: "21. 제동력부족과 제동불완해 감지조건.",
                    a: "1. 제동불완해 감지 조건 : 비상제동, 상용제동, ATC제동 및 보안제동이 체결되지 않은 조건에서 제동 완해후 5초 경과해서 제동통 압력 설정치 초과시 제동불완해 발생\n2. 제동력부족 감지 조건 : 제동력부족 감지지령선(Isb) 여자 시 비상제동 동작, 상용제동 7단 및 ATC 제동 체결(ATCSBR여자) 조건에서 제동력부족 감지후 3.5초동안 제동통     압력 기준치 미달 시 비상제동 체결"
                },
                {
                    id: 23,
                    q: "23. 전공변환밸브(EPV)의 작용 : 제동, 유지, 배기 작용",

                {

                },
                {

                    q: "29. 교직 절연구간 운전시 모진 발생 원인",

                {

                {

                },
                {
                    id: 34,
                    q: "34. 과천선 열차 운전 중 출발신호 정지 시 수신호 생략이 가능한 경우",
                    a: "① 입환 신호기에 진행신호를 현시할 수 있는 선로\n② 입환 표지에 개통을 현시할 수 있는 선로\n③ 역 조작반 취급으로 신호 연동장치에 의하여 진로를 잠글 수 있는 선로\n④ 고장 신호기와 연동된 선로 전환기가 상시 잠겨 있는 경우"
                },
                {
                    id: 35,
                    q: "35. ACM공기 사용 기기",
                    a: "Pan, EGS, MCB, ADcg, L1, L2, L3"
                },
                {
                    id: 36,
                    q: "36. ADS 절환 시 MCB 차단 불능 현상 발생 이유",
                    a: "1. 진동차단부 내에서 고정접점과 가동접점이 용착된 MCB 기계적 고착 시\n2. AC구간에서 MCBN1이 차단된 경우\n3. DC구간에서 MCB 기계적 고착 또는 MCBN2 차단 시(MCB 차단 불능 등)"
                },
                {
                    id: 37,
                    q: "37. 주퓨즈 용손 시 현상",
                    a: "1. 주퓨즈의 빨간색 단추가 약 30mm 돌출\n2. 주퓨즈 용손으로 주변압기 냉각용 송풍기인 MTOM 정지\n3. 60초 후 MTOFTR 작동 및 MTAR이 여자되어 MCB 차단"
                },
            ];


            let questions = [];
            let currentIndex = 0;
            let timer = null;
            const TOTAL_TIME = 60;
            let timeLeft = TOTAL_TIME;
                // 기존 변수들 아래에 전체 타이머 관련 변수 추가
            let totalTimer = null;
            let totalSeconds = 0;
            let isTotalTimerPaused = false;
              // 🔥 신규: 전체 타이머 시작 함수
            function startTotalTimer() {
                clearInterval(totalTimer);
                totalSeconds = 0;
                isTotalTimerPaused = false;
                updateTotalTimerUI();
                document.getElementById('btnPause').innerText = '⏸️ 일시정지';

                totalTimer = setInterval(() => {
                    if (!isTotalTimerPaused) {
                        totalSeconds++;
                        updateTotalTimerUI();
                    }
                }, 1000);
            }

                // 🔥 신규: 전체 타이머 UI 업데이트 (MM:SS 형식)
            function updateTotalTimerUI() {
                const minutes = Math.floor(totalSeconds / 60);
                const seconds = totalSeconds % 60;
                const formatted = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
                document.getElementById('totalTimerText').innerText = formatted;
            }

                // 🔥 신규: 일시정지 / 재개 토글 함수
            function toggleTotalTimer() {
                isTotalTimerPaused = !isTotalTimerPaused;
                const btn = document.getElementById('btnPause');
                if (isTotalTimerPaused) {
                    btn.innerText = '▶️ 재개';
                    btn.style.backgroundColor = '#fef08a';
                } else {
                    btn.innerText = '⏸️ 일시정지';
                    btn.style.backgroundColor = '#e2e8f0';
                }
            }

            // 풀었던 문제의 번호를 중복 없이 저장하는 변수
            let solvedIndexes = new Set();

            // 배열을 랜덤으로 섞는 함수 (피셔-예이츠 셔플 알고리즘)
            function shuffleArray(array) {
                let shuffled = [...array];
                for (let i = shuffled.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
                }
                return shuffled;
            }

            // 퀴즈 초기화 및 다시 시작 함수
            function initQuiz() {
                // 1. 이전 퀴즈 기록(풀었던 문제 번호) 초기화
                solvedIndexes.clear();

                // 2. 문제 다시 섞기 및 첫 번째 문제로 설정
                questions = shuffleArray(rawQuestions);
                currentIndex = 0;

                // 3. 화면 전환 (결과 화면은 숨기고 퀴즈 문제 화면과 타이머 표시)
                document.getElementById('quizArea').style.display = 'block';
                document.getElementById('resultCard').style.display = 'none';
                document.querySelector('.timer-bar-container').style.display = 'block';
                document.querySelector('.info-group').style.display = 'flex';

                // 4. 첫 번째 문제 출력 및 타이머 작동 시작
                renderQuestion();
                startTimer();
                startTotalTimer(); // 🔥 신규 추가: 전체 타이머도 함께 시작
            }

            function startTimer() {
                clearInterval(timer);
                timeLeft = TOTAL_TIME;
                updateTimerUI();

                timer = setInterval(() => {
                    timeLeft--;
                    updateTimerUI();

                    if (timeLeft <= 0) {
                        clearInterval(timer);
                        document.getElementById('answer').style.display = 'block';
                    }
                }, 1000);
            }

            function updateTimerUI() {
                const timerText = document.getElementById('timerText');
                const timerBadge = document.getElementById('timerBadge');
                const timerBar = document.getElementById('timerBar');

                timerText.innerText = `${timeLeft}초`;

                const percentage = (timeLeft / TOTAL_TIME) * 100;
                timerBar.style.width = `${percentage}%`;

                if (timeLeft <= 10) {
                    timerBadge.classList.add('danger');
                    timerBar.style.backgroundColor = '#dc2626';
                } else {
                    timerBadge.classList.remove('danger');
                    timerBar.style.backgroundColor = '#3b82f6';
                }
            }

            function renderQuestion() {
                const item = questions[currentIndex];

                const questionNum = item.id !== undefined ? item.id : (rawQuestions.indexOf(item) + 1);
                solvedIndexes.add(questionNum);

                document.getElementById('question').innerText = item.q;

                const imgEl = document.getElementById('signImg');
                if (item.img) {
                    imgEl.src = item.img;
                    imgEl.style.display = 'block';
                } else {
                    imgEl.style.display = 'none';
                }

                const answerBox = document.getElementById('answerContent');
                if (item.name && item.func) {
                    answerBox.innerHTML = `
                            <div class="answer-title">📌 [표지 이름]</div>
                            <div>${item.name}</div>
                            <div class="answer-title" style="margin-top:12px;">💡 [표지 기능]</div>
                            <div>${item.func}</div>
                        `;
                } else {
                    answerBox.innerHTML = `<div>${item.a}</div>`;
                }

                document.getElementById('answer').style.display = 'none';
                document.getElementById('progress').innerText = `${currentIndex + 1} / ${questions.length}`;

                startTimer();
            }

            function startTimer() {
                clearInterval(timer);
                timeLeft = TOTAL_TIME;
                updateTimerUI();

                timer = setInterval(() => {
                    timeLeft--;
                    updateTimerUI();

                    if (timeLeft <= 0) {
                        clearInterval(timer);
                        document.getElementById('answer').style.display = 'block';
                    }
                }, 1000);
            }

            function resetTimer() {
                startTimer(); // 타이머를 처음부터(60초) 다시 시작합니다.
            }

            function toggleAnswer() {
                const answerEl = document.getElementById('answer');
                if (answerEl.style.display === 'none' || answerEl.style.display === '') {
                    answerEl.style.display = 'block';
                } else {
                    answerEl.style.display = 'none';
                }
            }

            function nextQuestion() {
                if (currentIndex < questions.length - 1) {
                    currentIndex++;
                    renderQuestion();
                }
            }

            function prevQuestion() {
                if (currentIndex > 0) {
                    currentIndex--;
                    renderQuestion();
                }
            }

            // ... (기존 renderQuestion, nextQuestion 함수들) ...

            // ---------------- [여기 아래에 새로 추가하세요] ----------------
            // 퀴즈 종료 및 결과창 표시 함수
            function finishQuiz() {
                // 1. 타이머 정지
                clearInterval(timer);
                clearInterval(totalTimer); // 🔥 신규 추가: 전체 타이머 정지

                // 🔥 신규 추가: 총 걸린 시간 분/초 계산 및 결과 화면 출력
                const minutes = Math.floor(totalSeconds / 60);
                const seconds = totalSeconds % 60;
                document.getElementById('totalTimeResult').innerText = `⏱️ 총 소요 시간: ${minutes}분 ${seconds}초`;

                // 2. 풀었던 문제 번호 정렬 (오름차순: 1, 2, 3...)
                const sortedNumbers = Array.from(solvedIndexes).sort((a, b) => a - b);

                // 3. 풀었던 문제 태그 HTML 생성
                const listContainer = document.getElementById('solvedList');
                if (sortedNumbers.length > 0) {
                    listContainer.innerHTML = sortedNumbers
                        .map(num => `<span class="num-tag">${num}번</span>`)
                        .join('');
                } else {
                    listContainer.innerHTML = `<span style="color: #94a3b8; font-size: 0.85rem;">풀었던 문제가 없습니다.</span>`;
                }

                // 4. 학습한 총 문제 수 업데이트
                document.getElementById('resultSummary').innerText = `총 ${sortedNumbers.length}문제를 학습하셨습니다.`;

                // 5. 화면 전환 (퀴즈 영역 & 타이머 숨기고 결과 카드 표시)
                document.getElementById('quizArea').style.display = 'none';
                document.querySelector('.timer-bar-container').style.display = 'none';
                document.querySelector('.info-group').style.display = 'none';
                document.getElementById('resultCard').style.display = 'block';
            }
            // -----------------------------------------------------------


            // 페이지가 완전히 로드된 후 Quiz 및 타이머 실행
            window.onload = function () {
                initQuiz();
            };
    </script>
